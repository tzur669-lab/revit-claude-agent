[project]
name = "mcp-server-for-revit"
version = "0.1.0"
description = "MCP server for Revit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "live: requires a running Revit + pyRevit Routes session (excluded by default: pytest -m 'not live')",
]
